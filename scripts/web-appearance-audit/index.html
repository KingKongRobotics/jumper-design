<!doctype html><html lang="en"><meta charset="utf-8"><title>Web appearance audit</title><style>body{font:15px system-ui;margin:20px;background:#eef1ed}main{display:flex;gap:12px}canvas{width:48vw;height:36vw}button,select{font:inherit;padding:8px;margin:8px}pre{white-space:pre-wrap}</style><h1>Web appearance audit</h1><select id="select"></select><button id="save">Generate all embedded thumbnails</button><button id="robot-save">Generate all robot composition views</button><p>Left: original Web scene. Right: compiled MJCF reconstructed by the real Web importer. Camera, lighting, and exposure match. Thumbnail mode disables distance fog to keep the full scene visible.</p><main><canvas id="original"></canvas><canvas id="imported"></canvas></main><pre id="status">Preparing</pre><script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module">
import * as T from 'three';import {buildImportedScene} from './importer.js';
const ids=['home','bedroom','soccer','plaza','warehouse','pingpong','pouring','mine','litter','narrow-bridge','shelf-maze','switchback-slopes'];const names=['Home','Bedroom','Soccer Field','Corner Plaza','Warehouse Challenge','Ping-Pong Retrieval','Pouring Drinks','Mine Survey','Litter Cleanup','Narrow Bridge','Shelf Maze','Switchback Slopes'];
const select=document.querySelector('#select'),status=document.querySelector('#status');ids.forEach((id,i)=>select.add(new Option(names[i],id)));
function renderer(canvas){let r=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});r.setSize(1000,750,false);r.outputColorSpace=T.SRGBColorSpace;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFShadowMap;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.95;return r;}
const ra=renderer(document.querySelector('#original')),rb=renderer(document.querySelector('#imported'));
function stage(root){const s=new T.Scene();s.background=new T.Color('#eef1ed');/* Thumbnail mode: omit distance fog for full-scene framing on both sides. */s.add(new T.HemisphereLight(0xffffff,0x90988b,1.7));const sun=new T.DirectionalLight(0xfff8ed,2.4);sun.position.set(1.5,-2,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:.01,far:10});sun.shadow.bias=-.0003;sun.shadow.normalBias=.002;s.add(sun,root);return s;}
let last;
async function show(id,robot=false){status.textContent='Rendering '+id;const p=await(await fetch((robot?'robot-payloads/':'payloads/')+id+'.json')).json();const group=buildImportedScene(p);if(p.flex.length)group.userData.update({softProps:p.flex.map(f=>({id:f.id,vertices:f.vertices}))});const lo=new T.Vector3(...p.bounds[0]),hi=new T.Vector3(...p.bounds[1]),center=lo.clone().add(hi).multiplyScalar(.5),radius=hi.distanceTo(lo)/2;const camera=new T.PerspectiveCamera(39,4/3,.005,80);camera.up.set(0,0,1);const distance=radius/Math.sin(39*Math.PI/360)*1.1;camera.position.copy(center).add(new T.Vector3(-.5,-.5,.7071).multiplyScalar(distance));if(robot){center.set(...p.robotPosition).add(new T.Vector3(0,0,.08));camera.position.copy(center).add(new T.Vector3(-.5,-.5,.7071).multiplyScalar(1.8));}camera.lookAt(center);
const right=stage(group);rb.render(right,camera);let reference=null;const response=robot||id==='pouring'?{ok:false}:await fetch('reference/'+id+'.json');if(response.ok)reference=new T.ObjectLoader().parse(await response.json());
if(!robot&&id==='bedroom'){const loaded=new Promise(resolve=>{T.DefaultLoadingManager.onLoad=resolve;});const module=await import('./bedroom/src/components/simulator-bedroom.js');reference=module.buildBedroomEnvironment();await reference.userData.ready;await loaded;}
if(reference){ra.render(stage(reference),camera);}else{ra.render(stage(new T.Group()),camera);}
let error=null;if(reference){let a=new Uint8Array(1000*750*4),b=new Uint8Array(a.length);ra.getContext().readPixels(0,0,1000,750,ra.getContext().RGBA,ra.getContext().UNSIGNED_BYTE,a);rb.getContext().readPixels(0,0,1000,750,rb.getContext().RGBA,rb.getContext().UNSIGNED_BYTE,b);let sum=0;for(let i=0;i<a.length;i++)if(i%4!==3)sum+=Math.abs(a[i]-b[i]);error=sum/(1000*750*3);}
last={id,meanAbsoluteRgbError:error,comparison:reference?'same-view-source-vs-compiled':'authored-or-bedroom-separate-review',profile:'be-web/1'};status.textContent=JSON.stringify(last,null,2);return last;}
select.onchange=()=>show(select.value).catch(e=>status.textContent=e.stack);
document.querySelector('#save').onclick=async()=>{try{const results=[];for(const id of ids){select.value=id;results.push(await show(id));const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,image:rb.domElement.toDataURL('image/png'),report:last})});if(!response.ok)throw Error(await response.text());}status.textContent='Done: 12 Web standard thumbnails saved.\n'+JSON.stringify(results,null,2);}catch(e){status.textContent=e.stack;}};
document.querySelector('#robot-save').onclick=async()=>{try{for(const id of ids){select.value=id;await show(id,true);const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,kind:'robot',image:rb.domElement.toDataURL('image/png'),report:last})});if(!response.ok)throw Error(await response.text());}status.textContent='Done: 12 Web robot composition views saved.';}catch(e){status.textContent=e.stack;}};
show('home').catch(e=>status.textContent=e.stack);
</script>
