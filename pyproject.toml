[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellflow"
version = "0.6.0"
description = "Design Workflow: robot appearance and environment creation, validation and interchange"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "NOTICE.md"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/KingKongRobotics/kingkong-design"
Issues = "https://github.com/KingKongRobotics/kingkong-design/issues"

[project.optional-dependencies]
sim = ["numpy>=1.26", "scipy>=1.11", "trimesh>=4.0", "mujoco>=3.3", "fast-simplification>=0.2", "rtree>=1.4"]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
shellflow = "shellflow.cli:main"
mjscene = "mjscene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjscene = ["scene.schema.json"]

[tool.setuptools.data-files]
"share/shellflow/schemas" = ["schemas/skin-package.schema.json", "schemas/skin-package-v2.schema.json", "schemas/skin-package-v3.schema.json", "schemas/map-package.schema.json", "schemas/map-package-v2.schema.json"]
